openapi: 3.0.3

info:
  title: Task Manager API
  version: 1.0.0
  description: REST API for team task management

servers:
  - url: http://localhost:8080

tags:
  - name: Auth
  - name: Teams
  - name: Tasks
  - name: Comments
  - name: Stats

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string

    RegisterResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    Team:
      type: object
      required:
        - id
        - name
        - created_by
        - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    CreateTeamRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CreateTeamResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64

    InviteMemberRequest:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: integer
          format: int64
        role:
          type: string
          enum:
            - admin
            - member

    UpdateRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - admin
            - member

    Task:
      type: object
      required:
        - id
        - team_id
        - title
        - status
        - created_by
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
        created_by:
          type: integer
          format: int64
        assignee_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer

    CreateTaskRequest:
      type: object
      required:
        - team_id
        - title
        - status
      properties:
        team_id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          type: string
        assignee_id:
          type: integer
          format: int64
          nullable: true

    CreateTaskResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64

    UpdateTaskRequest:
      type: object
      required:
        - version
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
        assignee_id:
          type: integer
          format: int64
          nullable: true
        version:
          type: integer
          minimum: 1

    TaskHistory:
      type: object
      required:
        - id
        - task_id
        - changed_by
        - changes
        - created_at
      properties:
        id:
          type: integer
          format: int64
        task_id:
          type: integer
          format: int64
        changed_by:
          type: integer
          format: int64
        changes:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    TaskComment:
      type: object
      required:
        - id
        - task_id
        - user_id
        - content
        - created_at
      properties:
        id:
          type: integer
          format: int64
        task_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        content:
          type: string
        created_at:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string

    CreateCommentResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64

    AssigneeStats:
      type: object
      required:
        - user_id
        - name
        - closed_tasks
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
        closed_tasks:
          type: integer
          format: int64

    TeamStats:
      type: object
      required:
        - tasks_by_status
        - top_assignees
        - comments_count
      properties:
        tasks_by_status:
          type: object
          additionalProperties:
            type: integer
            format: int64

        top_assignees:
          type: array
          items:
            $ref: '#/components/schemas/AssigneeStats'

        avg_close_time_seconds:
          type: number
          format: double
          nullable: true

        comments_count:
          type: integer
          format: int64

paths:
  /api/v1/register:
    post:
      tags:
        - Auth
      summary: Register user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/login:
    post:
      tags:
        - Auth
      summary: Authenticate user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /api/v1/teams:
    post:
      tags:
        - Teams
      summary: Create team
      operationId: createTeam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTeamResponse'

        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Teams
      summary: Get current user's teams
      operationId: getTeams
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/teams/{id}/invite:
    post:
      tags:
        - Teams
      summary: Add user to team
      operationId: inviteTeamMember
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Team ID
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'

      responses:
        '204':
          description: User added to team

        '400':
          description: Invalid team ID or role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: Only owner or admin may invite users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: User is already a team member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/teams/{id}/members/{user_id}/role:
    put:
      tags:
        - Teams
      summary: Change team member role
      operationId: updateTeamMemberRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Team ID
          schema:
            type: integer
            format: int64

        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'

      responses:
        '204':
          description: Role updated

        '400':
          description: Invalid request or role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: Only team owner may change roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Team member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks:
    post:
      tags:
        - Tasks
      summary: Create task
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTaskResponse'
        '400':
          description: Invalid request or assignee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User is not a member of the team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Tasks
      summary: Get team tasks
      operationId: getTasks
      security:
        - bearerAuth: []
      parameters:
        - name: team_id
          in: query
          required: true
          schema:
            type: integer
            format: int64

        - name: status
          in: query
          required: false
          schema:
            type: string

        - name: assignee_id
          in: query
          required: false
          schema:
            type: integer
            format: int64

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100

        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0

      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User is not a member of the team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{id}:
    put:
      tags:
        - Tasks
      summary: Update task
      operationId: updateTask
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'

      responses:
        '204':
          description: Task updated
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User cannot update this task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{id}/history:
    get:
      tags:
        - Tasks
      summary: Get task history
      operationId: getTaskHistory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Task history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskHistory'
        '400':
          description: Invalid task ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No access to the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{id}/comments:
    post:
      tags:
        - Comments
      summary: Add task comment
      operationId: createTaskComment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'

      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCommentResponse'

        '400':
          description: Invalid request or empty comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: User is not a member of the task team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Comments
      summary: Get task comments
      operationId: getTaskComments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: List of task comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskComment'

        '400':
          description: Invalid task ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: User is not a member of the task team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/teams/{team_id}/stats:
    get:
      tags:
        - Stats
      summary: Get team statistics
      operationId: getTeamStats
      security:
        - bearerAuth: []
      parameters:
        - name: team_id
          in: path
          required: true
          description: Team ID
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Team statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamStats'

        '400':
          description: Invalid team ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: Only owner or admin may view team statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'